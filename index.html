.radio-inputs {
  position: relative;
  display: flex;
  border-top-left-radius: 0.5rem;
  border-top-right-radius: 0.5rem;
  background-color: #70c489;
  font-size: 14px;
 
  padding: 0.5rem 1.5rem 0 1.5rem;
}

.radio-inputs .radio input {
  display: none;
}

.radio-inputs .radio .name {
  display: flex;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  border: none;
  transition: all 0.15s ease-in-out;
  position: relative;
  border-top-left-radius: 0.5rem;
  border-top-right-radius: 0.5rem;
}

.radio-inputs .radio input + .name:hover {
  color: #fff;
}

.radio-inputs .radio input + .name .pre-name,
.radio-inputs .radio input + .name .pos-name {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  background-color: #70c489;
  bottom: 0;
  opacity: 0;
}

.radio-inputs .radio input + .name .pre-name {
  right: -10px;
  border-bottom-left-radius: 300px;
  box-shadow: -3px 3px 0px 3px #e8e8e8;
}

.radio-inputs .radio input + .name .pos-name {
  left: -10px;
  border-bottom-right-radius: 300px;
  box-shadow: 3px 3px 0px 3px #e8e8e8;
}

.radio-inputs .radio input:checked + .name {
  animation: name-activated;
  animation-duration: 0.1s;
  animation-fill-mode: forwards;
}

.legend-itemt { cursor:pointer; display:inline-block; margin:0 6px; padding:5px 11px; border-radius:4px; color:#fff; font-weight:500; font-size:18px; user-select:none; }
.legend-item.hidden { opacity:0.4; text-decoration:line-through; }
.section-title { text-align:center; font-size:18px; font-weight:500; color:var(--color-text-primary); margin:24px 0 8px; border-bottom:1px solid var(--color-border-tertiary); padding-bottom:6px; }
.legend-row { text-align:center; margin-bottom:12px; }
.chart-wrap { position:relative; width:100%; }



@@keyframes name-activated {
  from {
    background-color: #70c489;
    font-weight: 400;
    cursor: pointer;
    color: white;
  }

  to {
    background-color: #e8e8e8;
    font-weight: 600;
    cursor: default;
    color: black;
  }
}

.radio-inputs .radio input:checked + .name .pre-name,
.radio-inputs .radio input:checked + .name .pos-name {
  animation: name-border-activated;
  animation-duration: 0.1s;
  animation-fill-mode: forwards;
  z-index: 0;
}

@@keyframes name-border-activated {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

.radio-inputs .radio .name span:last-child {
  z-index: 1;
  padding: 0.5rem 0.8rem;
  border-top-left-radius: 0.5rem;
  border-top-right-radius: 0.5rem;
}

.radio-inputs .radio input:checked + .name span:last-child {
  animation: name-text-activated;
  animation-duration: 0.1s;
  animation-fill-mode: forwards;
}

@@keyframes name-text-activated {
  from {
    background-color: #70c489;
  }

  to {
    background-color: #e8e8e8;
  }
}

.radio-inputs > .radio > .content {
  display: none;
}

.radio-inputs > label.radio > input:checked ~ div.content {
  display: block;
}

.radio-inputs > label.radio > input:checked ~ div.content div * {
  animation: content-activated;
  animation-duration: 1s;
  animation-fill-mode: forwards;
}

.content {

<script>
    // Register datalabels plugin globally
    Chart.register(ChartDataLabels);

    // Data for group 1
    const data1 = [
      { country: "Buccal Mucosa", value: 7.94 },
      { country: "Leukemia", value: 7.81 },
      { country: "Anterior Tongue", value: 4.77 },
      { country: "Non-Hodgkins Lymphoma", value: 2.95 },
      { country: "Rectum", value: 2.88 }

    ];
    const data2 = [

    { country: "Buccal Mucosa", value: 19.01 },
    { country: "Leukemia", value: 5.66 },
    { country: "Anterior Tongue", value: 8.31 },
    { country: "Non-Hodgkins Lymphoma", value: 5.47 },
    { country: "Lung", value: 10.60 }
    ];
    const data3 = [
      { country: "Buccal Mucosa", value: 5.43 },
      { country: "Prostate", value: 10.04 },
      { country: "Stomach", value: 4.77 },
      { country: "Oesophagus", value: 4.61 },
      { country: "Lung", value: 13.00 }
    ];

    // Data for group 2
    const data4 = [
      { country: "Breast", value: 28.79 },
      { country: "Leukemia", value: 8.51 },
      { country: "Thyroid", value: 7.56 },
      { country: "Ovary", value: 5.91 },
      { country: "Cervix", value: 4.84 }
    ];
    const data5 = [
      { country: "Breast", value: 31.90 },
      { country: "Cervix", value: 10.92 },
      { country: "Gall Bladder", value: 7.18 },
      { country: "Ovary", value: 6.74 },
      { country: "Lung", value: 4.24 }
    ];
    const data6 = [
      { country: "Breast", value: 23.77 },
      { country: "Cervix", value: 10.18 },
      { country: "Lung", value: 6.15 },
      { country: "Gall Bladder", value: 6.04 },
      { country: "Ovary", value: 5.26 }
    ];

    // Utility: sort descending by value
    function sortDescending(data) {
      return data.slice().sort((a,b) => b.value - a.value);
    }

    // Sort all datasets
    const sortedDataGroup1 = [sortDescending(data1), sortDescending(data2), sortDescending(data3)];
    const sortedDataGroup2 = [sortDescending(data4), sortDescending(data5), sortDescending(data6)];

    // Get unique countries for each group
    function getUniqueCountries(datasets) {
      const set = new Set();
      datasets.forEach(data => data.forEach(d => set.add(d.country)));
      return Array.from(set);
    }
    const countriesGroup1 = getUniqueCountries(sortedDataGroup1);
    const countriesGroup2 = getUniqueCountries(sortedDataGroup2);

    // Assign colors for all countries (you can customize colors)
    const colorPalette = [
      '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd',
      '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'
    ];
    // Map countries to colors for group 1 and 2 separately
    function assignColors(countries) {
      const colors = {};
      countries.forEach((c,i) => {
        colors[c] = colorPalette[i % colorPalette.length];
      });
      return colors;
    }
    const colorsGroup1 = assignColors(countriesGroup1);
    const colorsGroup2 = assignColors(countriesGroup2);

    // Prepare chart data for a single chart
    // Sort data descending, labels = countries, data = values, backgroundColor by country
    function prepareChartData(data, colors) {
      const sorted = sortDescending(data);
      return {
        labels: sorted.map(d => d.country),
        datasets: [{
          label: 'Value',
          data: sorted.map(d => d.value),
          backgroundColor: sorted.map(d => colors[d.country]),
          borderRadius: 5,
          barPercentage: 0.7,
          categoryPercentage: 0.8
        }]
      };
    }

    // Common chart options
    const commonOptions = {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          beginAtZero: true,
          ticks: { precision: 0 }
        },
        y: {
            ticks: { font: { size: 18 }, color: '#000000' }
        }
      },
      plugins: {
          legend: { display: false },

        tooltip: {
          callbacks: {
            label: ctx => `${ctx.label}: ${ctx.parsed.x}`
          }
        },
        datalabels: {
          anchor: 'end',
          align: 'start',
         // color: '#000',
          color: '#ffffff',
          font: {
            weight: 'bold',
            size: 14,

          },
          formatter: value => value.toFixed(2)
        }
      },
      animation: { duration: 800 }
    };

    // Create charts for group 1
    const ctx1 = document.getElementById('chart1').getContext('2d');

    // Shared legend logic for each group
    function createLegend(containerId, countries, colors, charts) {
      const container = document.getElementById(containerId);
      const visibility = {};
      countries.forEach(c => visibility[c] = true);

      countries.forEach(country => {
        const item = document.createElement('div');
        item.classList.add('legend-item');
        item.dataset.country = country;

          // Apply inline styles instead of CSS class
        Object.assign(item.style, {
            cursor: 'pointer',
            margin: '5px 15px',
            //  fontWeight: 'bold',
            fontSize: '18px',
            display: 'flex',
            alignItems: 'center',
            opacity: '1',
            transition: 'opacity 0.3s',
            userSelect: 'none'
        });


        const colorBox = document.createElement('div');
        colorBox.classList.add('legend-color-box');
        colorBox.style.backgroundColor = colors[country];

        const label = document.createElement('span');
        label.textContent = country;

        item.appendChild(colorBox);
        item.appendChild(label);

        item.addEventListener('click', () => {
          visibility[country] = !visibility[country];
          if (visibility[country]) {
            item.classList.remove('disabled');
          } else {
            item.classList.add('disabled');
          }

          charts.forEach(chart => {
            const dataset = chart.data.datasets[0];
            const idx = chart.data.labels.indexOf(country);
            if (idx !== -1) {
              dataset.data[idx] = visibility[country] ? getOriginalValue(chart, country) : 0;
            }
            chart.update();
          });
        });

        container.appendChild(item);
      });

      // Helper to get original value for a country in a chart
      function getOriginalValue(chart, country) {
        // Find original data array for this chart
        let originalData;
        switch(chart.canvas.id) {
          case 'chart1': originalData = data1; break;
          case 'chart2': originalData = data2; break;
          case 'chart3': originalData = data3; break;
          case 'chart4': originalData = data4; break;
          case 'chart5': originalData = data5; break;
          case 'chart6': originalData = data6; break;
          default: originalData = [];
        }
        const item = originalData.find(d => d.country === country);
        return item ? item.value : 0;
      }
    }

    // Create legends
    createLegend('legend-group1', countriesGroup1, colorsGroup1, [chart1, chart2, chart3]);
    createLegend('legend-group2', countriesGroup2, colorsGroup2, [chart4, chart5, chart6]);

const ages = ["20-59","60+"];
const rowsPerGroup = 3;

const valueLabelPlugin = {
  id:'vlp',
  afterDatasetsDraw(chart){
    const ctx=chart.ctx; ctx.save();
    ctx.font='bold 14px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    chart.data.datasets.forEach((ds,i)=>{
      if(ds.hidden) return;
      const meta=chart.getDatasetMeta(i);
      meta.data.forEach((bar,idx)=>{
        const v=ds.data[idx];
        if(v===null||v===undefined||v<3) return;
        const bw=Math.abs(bar.base-bar.x);
        const x=Math.min(bar.base,bar.x)+(bw/2);
        const y=bar.y;
        ctx.fillStyle=bw>22?'white':'black';
        ctx.fillText(v.toFixed(1),x,y);
      });
    });
    ctx.restore();
  }
};

function makeLabelsPlugin(cancers) {
  return {
    id:'customLabels',
    afterDraw(chart){
      const ctx=chart.ctx;
      const yAxis=chart.scales.y;
      const xRight=chart.chartArea.right;
      const xLeft=chart.chartArea.left;
      ctx.save();

      // Cancer names on LEFT
      ctx.font='bold 14px Arial';
      ctx.fillStyle='#333';
      ctx.textAlign='right';
      ctx.textBaseline='middle';
      cancers.forEach((c,i)=>{
        const base=i*rowsPerGroup;
        const y0=yAxis.getPixelForValue(base);
        const y1=yAxis.getPixelForValue(base+1);
        const y=(y0+y1)/2;
        ctx.fillText(c, xLeft-6, y);
      });

      // Age labels on RIGHT
      ctx.font='bold 14px Arial';
      ctx.fillStyle='#555';
      ctx.textAlign='left';
      cancers.forEach((c,i)=>{
        ages.forEach((age,ai)=>{
          const rowIdx=i*rowsPerGroup+ai;
          const y=yAxis.getPixelForValue(rowIdx);
          ctx.fillText(age, xRight+6, y);
        });
      });

      ctx.restore();
    }
  };
}

const allCharts = {male:[], female:[]};

function buildChart(canvasId, dataByAge, group) {
  const cancers = dataByAge[ages[0]].map(d=>d.c);

  const labels = [];
  cancers.forEach(() => {
    labels.push(''); labels.push(''); labels.push('');
  });

  const datasets = treatments.map(t => {
    const data = labels.map((lbl,i) => {
      const cIdx=Math.floor(i/rowsPerGroup);
      const slot=i%rowsPerGroup;
      if(slot===2) return null;
      const age=ages[slot];
      const cancer=cancers[cIdx];
      const row=dataByAge[age].find(d=>d.c===cancer);
      return row ? (row[keyMap[t]]||0) : 0;
    });
    return {
      label:t, data,
      backgroundColor:colors[t],
      stack:'stack', hidden:false,
      categoryPercentage:1.0, barPercentage:1.0
    };
  });

  const labelsPlugin = makeLabelsPlugin(cancers);

  const chart = new Chart(document.getElementById(canvasId), {
    type:'bar',
    data:{ labels, datasets },
    options:{
      indexAxis:'y',
      responsive:true,
      maintainAspectRatio:false,
      plugins: {
          datalabels: {
              display: false   // ❌ disables duplicate labels
          },
        legend:{display:false},
        tooltip:{
          filter: item => item.parsed.x !== null && item.parsed.x > 0,
          callbacks:{
            title: items => {
              const i=items[0].dataIndex;
              const cIdx=Math.floor(i/rowsPerGroup);
              const slot=i%rowsPerGroup;
              return cancers[cIdx]+' — '+ages[slot];
            },
            label: c => c.dataset.label+': '+(c.parsed.x||0).toFixed(2)+'%'
          }
        }
      },
      scales:{
        x:{stacked:true,min:0,max:100,display:false,grid:{display:false}},
        y:{
          stacked:true,
          grid:{display:false},
          border:{display:false},
          ticks:{display:false}
        }
      },
      layout:{padding:{left:90, right:60, top:4, bottom:4}}
    },
    plugins:[valueLabelPlugin, labelsPlugin]
  });

  allCharts[group].push(chart);
}

buildChart('c1', maleData, 'male');
buildChart('c2', femaleData, 'female');

function makeLegend(id, group) {
  const el=document.getElementById(id);
  const vis={};
  treatments.forEach(t=>{vis[t]=true;});
  treatments.forEach(t=>{
    const s=document.createElement('span');
    s.className='legend-itemt'; s.textContent=t;
    s.style.backgroundColor=colors[t]; s.dataset.t=t;
    el.appendChild(s);
  });
  el.addEventListener('click',e=>{
    if(!e.target.classList.contains('legend-itemt')) return;
    const t=e.target.dataset.t; vis[t]=!vis[t];
    e.target.classList.toggle('hidden',!vis[t]);
    allCharts[group].forEach(ch=>{
      ch.data.datasets.forEach(ds=>{if(ds.label===t) ds.hidden=!vis[t];});
      ch.update();
    });
  });
}
